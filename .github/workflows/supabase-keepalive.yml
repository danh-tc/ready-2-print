name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC — well under Supabase's 7-day pause threshold
    - cron: "0 0 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health check
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/presets?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
